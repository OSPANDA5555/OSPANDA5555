<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Krish Kumar Dey — Aspiring SOC Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.5" stop-color="#0a1622"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- scanline grid -->
  <g stroke="#00E5FF" stroke-opacity="0.07">
    <path d="M0 55 H1200 M0 110 H1200 M0 165 H1200"/>
    <path d="M150 0 V220 M300 0 V220 M450 0 V220 M600 0 V220 M750 0 V220 M900 0 V220 M1050 0 V220"/>
  </g>

  <!-- animated waves -->
  <g>
    <path d="M-240 150 Q -120 120 0 150 T 240 150 T 480 150 T 720 150 T 960 150 T 1200 150 T 1440 150 V220 H-240 Z" fill="url(#waveB)" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="240 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-240 172 Q -120 146 0 172 T 240 172 T 480 172 T 720 172 T 960 172 T 1200 172 T 1440 172 V220 H-240 Z" fill="url(#waveA)" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" from="240 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- blinking cursor dot -->
  <circle cx="600" cy="38" r="4" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="105" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="54" font-weight="bold" letter-spacing="6" fill="#F3F4F6">KRISH KUMAR DEY</text>
  <text x="600" y="142" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="19" letter-spacing="4" fill="#00E5FF">ASPIRING SOC ANALYST</text>
  <text x="600" y="170" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#64748b">SIEM · LINUX · NETWORK SECURITY · THREAT DETECTION</text>
</svg>
